name: CI

# Unit tests and an end-to-end test-profile run, checked against the stored
# regression baseline (tests/baseline). CI never publishes images: building and
# pushing a new image tag is a deliberate manual step (see CLAUDE.md).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  NXF_ANSI_LOG: false

jobs:
  unit-tests:
    name: Unit tests (in pipeline container)
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v5

      - name: Get container image from nextflow.config
        id: image
        run: echo "image=$(grep -oP "^process\.container\s*=\s*'\K[^']+" nextflow.config)" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo "${{ steps.image.outputs.image }}" \
            python -m unittest discover -s tests/unit -v

  pipeline:
    name: Test profile (Nextflow ${{ matrix.nxf }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum supported version (manifest.nextflowVersion) and latest release
        nxf: ["24.10.0", "latest-stable"]
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nxf }}

      - name: Get container image from nextflow.config
        id: image
        run: echo "image=$(grep -oP "^process\.container\s*=\s*'\K[^']+" nextflow.config)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline with test data
        run: nextflow run ${GITHUB_WORKSPACE} -profile test,docker --outdir ./results

      - name: Compare outputs with regression baseline
        # results/ contains symlinks into work/, so mount the workspace at the
        # same path inside the container
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "${{ steps.image.outputs.image }}" \
            python tests/compare_to_baseline.py results

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs-${{ matrix.nxf }}
          path: |
            .nextflow.log
            results/pipeline_info/

  # The other ways of providing the software (HPC clusters usually have
  # Singularity/Apptainer, not Docker). Same test data, same baseline check.
  engines:
    name: Test profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [singularity, apptainer, conda]
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: latest-stable

      # Apptainer also provides the `singularity` command, so it serves both
      # the singularity and apptainer profiles
      - name: Install Apptainer
        if: matrix.profile != 'conda'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Install conda
        if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          conda-remove-defaults: true

      - name: Get container image from nextflow.config
        id: image
        run: echo "image=$(grep -oP "^process\.container\s*=\s*'\K[^']+" nextflow.config)" >> "$GITHUB_OUTPUT"

      - name: Run pipeline with test data
        shell: bash -el {0}
        run: |
          mkdir -p "$RUNNER_TEMP/sif"
          export NXF_SINGULARITY_CACHEDIR="$RUNNER_TEMP/sif" NXF_APPTAINER_CACHEDIR="$RUNNER_TEMP/sif"
          nextflow run ${GITHUB_WORKSPACE} -profile test,${{ matrix.profile }} --outdir ./results

      - name: Compare outputs with regression baseline
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE":"$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "${{ steps.image.outputs.image }}" \
            python tests/compare_to_baseline.py results

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-logs-${{ matrix.profile }}
          path: |
            .nextflow.log
            results/pipeline_info/
